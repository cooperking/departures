<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#0d1117"/>

  <!-- Pantograph -->
  <polyline points="76,70 81,50 99,50 104,70" fill="none" stroke="#00c7b7" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="78" y1="50" x2="102" y2="50" stroke="#00c7b7" stroke-width="3"/>

  <!-- Tram body -->
  <rect x="22" y="70" width="136" height="68" rx="11" fill="#161b22"/>
  <rect x="22" y="70" width="136" height="68" rx="11" fill="none" stroke="#00c7b7" stroke-width="3.5"/>

  <!-- Windows -->
  <rect x="34" y="82" width="30" height="24" rx="5" fill="#00c7b7" opacity="0.9"/>
  <rect x="75" y="82" width="30" height="24" rx="5" fill="#00c7b7" opacity="0.9"/>
  <rect x="116" y="82" width="30" height="24" rx="5" fill="#00c7b7" opacity="0.9"/>

  <!-- Doors -->
  <rect x="67" y="106" width="46" height="32" rx="3" fill="#0d1117"/>
  <line x1="90" y1="108" x2="90" y2="137" stroke="#00c7b7" stroke-width="1.5" opacity="0.5"/>

  <!-- Wheels -->
  <circle cx="52" cy="149" r="12" fill="#161b22" stroke="#30363d" stroke-width="3.5"/>
  <circle cx="52" cy="149" r="4" fill="#30363d"/>
  <circle cx="128" cy="149" r="12" fill="#161b22" stroke="#30363d" stroke-width="3.5"/>
  <circle cx="128" cy="149" r="4" fill="#30363d"/>

  <!-- Rail -->
  <line x1="8" y1="161" x2="172" y2="161" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
</svg>
